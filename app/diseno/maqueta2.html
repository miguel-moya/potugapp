<script>
(function () {
  var stage = document.getElementById('stage'), W = 1024, H = 768;
  function fit() {
    var top = window.navigator.standalone ? 20 : 14;
    var vw = window.innerWidth, vh = window.innerHeight - top;
    var s = Math.min(vw / W, vh / H);
    stage.style.width = (vw / s) + 'px';
    stage.style.height = (vh / s) + 'px';
    var t = 'translate(0px,' + top + 'px) scale(' + s + ')';
    stage.style.webkitTransform = t; stage.style.transform = t;
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  var other = document.body.getAttribute('data-otra'), x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; });
  document.addEventListener('touchend', function (e) {
    if (x0 === null || !other) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 80) location.href = other;
  });
})();
</script>
