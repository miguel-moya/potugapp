<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>Maqueta · Comer fuera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&amp;family=Space+Mono&amp;display=swap">
<!--
  Maqueta de Comer fuera. Datos inventados, a día 16 de noviembre.
  ?vista=ipad (página) · ?vista=ipad-portada (widget, página 2 de la portada)
  ?vista=movil (widget en la portada) · ?vista=movil-pagina · ?vista=movil-nuevo (apuntar un gasto)
  Añadir &ritmo=bien para ver el mes yendo por debajo del ritmo.
  Reglas: escala 4/8, radio 20, baraja con 40 px de solape para lo que forma una misma cosa.
-->
<style>
:root {
  --fondo: #e4e1d9; --widget: #f4f3ef; --finde: #ecebe6; --tinta: #1d1d1b;
  --sec: #5c5a54; --ter: #8a877f; --sep: #e3e0d9; --sep-fuerte: #d3cfc6; --sep-finde: #dbd8d0; --pista: #d6d3cb;
  --aviso: #b04a30; --ok: #3f8a54; --acento: #c9b29b;
  --lidia: #c98b8f; --miguel: #f0b95f; --bruno: #ef6c50; --familia: #9a826b;
  --mono: 'Space Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fondo); }
body { font-family: Manrope, -apple-system, sans-serif; color: var(--tinta); }
svg { display: block; }
.rot { font-family: var(--mono); font-size: 10px; color: var(--sec); }
.pto { display: inline-block; width: 6px; height: 6px; border-radius: 3px; flex-shrink: 0; }
.L { background: var(--lidia); } .M { background: var(--miguel); } .F { background: var(--familia); }
.bur { width: 20px; height: 20px; border-radius: 10px; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.crece { flex-grow: 1; }
.w { background: var(--widget); border-radius: 20px; }
.w-tit { margin: 0; font-size: 13px; font-weight: 600; }
.w-cab { display: flex; justify-content: space-between; align-items: baseline; }
.otro { opacity: 0.45; }

/* ---------- iPad: estructura ---------- */
.app { width: 1024px; height: 768px; display: flex; padding-top: 14px; }
.rail { width: 72px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 0 0 16px; }
.rail > * + * { margin-top: 4px; }
.logo { font-size: 28px; font-weight: 600; letter-spacing: -1px; height: 40px; margin-top: 4px; display: flex; align-items: center; }
.logo span { color: var(--bruno); }
.esp { flex-grow: 1; }
.nav { width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; }
.nav.activo { background: var(--tinta); color: var(--widget); }
.nav svg { width: 22px; height: 22px; }
.yo { width: 36px; height: 36px; border-radius: 18px; background: var(--lidia); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.content { flex-grow: 1; min-width: 0; padding: 0 16px 16px 0; display: flex; flex-direction: column; }
.topbar { height: 40px; flex-shrink: 0; padding-top: 4px; display: flex; align-items: center; }
.topbar > * + * { margin-left: 12px; }
.hora { font-size: 26px; font-weight: 300; letter-spacing: -1px; }
.fecha { font-size: 14px; color: var(--sec); }
.dots { margin-left: auto; display: flex; align-items: center; }
.dots span { width: 18px; height: 3px; border-radius: 2px; background: #c3c0b8; }
.dots span + span { margin-left: 4px; }
.dots span.on { background: var(--tinta); }
.cuerpo { flex-grow: 1; min-height: 0; display: flex; margin-top: 8px; }

/* ---------- Piezas comunes ---------- */
/* Baraja vertical: cada carta se mete 40 px bajo la anterior */
.carta { position: relative; background: var(--widget); border-radius: 20px; padding: 16px; box-shadow: inset 0 -1px 0 var(--sep); }
.carta + .carta { margin-top: -40px; padding-top: 56px; }
.carta.saldo { background: var(--finde); box-shadow: none; }
.mes { display: flex; align-items: center; justify-content: space-between; }
.mes .flechas { display: flex; align-items: center; }
.mes .flechas a { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--sec); }
.mes .flechas span { font-family: var(--mono); font-size: 11px; margin: 0 4px; }
.cifra { display: flex; flex-shrink: 0; align-items: baseline; margin-top: 12px; }
.cifra b { white-space: nowrap; }
.cifra .de { white-space: nowrap; }
.cifra b { font-weight: 300; line-height: 0.9; }
.cifra .de { font-size: 14px; color: var(--sec); margin-left: 8px; display: flex; align-items: center; }
.cifra .de svg { margin-left: 4px; color: var(--ter); }

/* Barra con la marca de dónde deberíamos ir hoy */
.barra { position: relative; flex-shrink: 0; height: 8px; border-radius: 4px; background: var(--pista); }
.barra i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--tinta); }
.barra.rapido i { background: var(--aviso); }
.barra .marca { position: absolute; top: -4px; width: 2px; height: 16px; margin-left: -1px; border-radius: 1px; background: var(--tinta); box-shadow: 0 0 0 2px var(--widget); }
.barra .eti { position: absolute; top: 20px; font-family: var(--mono); font-size: 10px; color: var(--sec); white-space: nowrap; -webkit-transform: translateX(-50%); transform: translateX(-50%); }
.estado { font-size: 13px; font-weight: 500; }
.estado.bien { color: var(--ok); } .estado.rapido { color: var(--aviso); }
.datos { display: flex; }
.datos > div { flex: 1 1 0; display: flex; flex-direction: column; }
.datos > div + div { margin-left: 12px; }
.datos .v { font-size: 14px; margin-top: 4px; }

/* Saldo entre Lidia y Miguel */
.saldo-fila { display: flex; align-items: center; }
.saldo-fila .burs { display: flex; align-items: center; }
.saldo-fila .burs svg { margin: 0 4px; color: var(--sec); }
.saldo-fila .txt { margin-left: 12px; flex-grow: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.saldo-fila .txt b { font-weight: 600; }
.btn-linea { height: 40px; padding: 0 20px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--tinta); display: flex; align-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.btn-mas { width: 40px; height: 40px; border-radius: 20px; background: var(--tinta); color: var(--widget); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Apuntar gasto (abre la hoja) */
.anadir { display: flex; align-items: center; height: 48px; padding: 0 6px 0 16px; border-radius: 24px; background: var(--finde); }
.anadir span { flex-grow: 1; font-size: 14px; color: var(--ter); }
.anadir .btn-mas { width: 36px; height: 36px; border-radius: 18px; }

/* Lista de gastos: franjas por día */
.franja { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 16px; background: var(--finde); font-size: 12px; font-weight: 600; color: var(--sec); }
.franja .rot { font-weight: 400; }
.gasto { display: flex; align-items: center; min-height: 52px; padding: 0 16px; }
.gasto + .gasto { box-shadow: inset 0 1px 0 var(--sep); }
.gasto .tipo { width: 32px; height: 32px; border-radius: 16px; background: var(--finde); display: flex; align-items: center; justify-content: center; color: var(--sec); flex-shrink: 0; }
.gasto .nom { flex-grow: 1; min-width: 0; margin-left: 12px; display: flex; flex-direction: column; }
.gasto .nom .n1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gasto .nom .rot { margin-top: 2px; display: flex; align-items: center; }
.gasto .nom .rot .pto { margin-right: 6px; }
.gasto .imp { font-family: var(--mono); font-size: 13px; margin-left: 12px; }

/* Meses (historial) */
.meses { display: flex; align-items: flex-end; position: relative; }
.meses .col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; }
.meses .col + .col { margin-left: 12px; }
.meses .v { font-family: var(--mono); font-size: 10px; color: var(--sec); }
.meses .b { width: 100%; max-width: 48px; border-radius: 8px 8px 4px 4px; background: var(--pista); margin-top: 4px; }
.meses .col.actual .b { background: var(--acento); }
.meses .col.sobre .b { background: #d9b3a6; }
.meses .m { font-family: var(--mono); font-size: 10px; color: var(--sec); margin-top: 8px; }
.meses .tope { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--sec); }
.meses .tope span { position: absolute; right: 0; top: -16px; font-family: var(--mono); font-size: 10px; color: var(--sec); background: var(--widget); padding-left: 4px; }

/* ---------- iPad: página ---------- */
.izq { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.izq .cifra b { font-size: 64px; letter-spacing: -2px; }
.izq .barra { height: 12px; border-radius: 6px; margin-top: 24px; }
.izq .barra i { border-radius: 6px; }
.izq .barra .marca { height: 20px; }
.izq .barra .eti { top: 24px; }
.hist { margin-top: 16px; flex-grow: 1; padding: 16px; display: flex; flex-direction: column; }
.lista { width: 372px; flex-shrink: 0; margin-left: 16px; display: flex; flex-direction: column; overflow: hidden; }
.lista-cab { padding: 16px; }
.cab { display: flex; align-items: center; justify-content: space-between; height: 36px; }
.cab h1 { margin: 0; font-size: 16px; font-weight: 600; }
.cab .sub { font-size: 12px; color: var(--sec); font-weight: 400; margin-left: 8px; }

/* ---------- iPad: widget en la portada ---------- */
.filas { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 8px; }
.fila { flex: 1 1 0; min-height: 0; display: flex; }
.fila + .fila { margin-top: 16px; }
.fila > * { width: calc((100% - 32px) / 3); flex-shrink: 0; }
.fila > * + * { margin-left: 16px; }
.pend { border: 1.5px dashed #c3bfb6; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--sec); }
.wi { display: flex; flex-direction: column; }
.wi .carta:first-child { flex-grow: 1; display: flex; flex-direction: column; }
.wi .cifra b { font-size: 44px; letter-spacing: -1.5px; }
.wi .barra { margin-top: 16px; }
.ult { display: flex; align-items: center; font-size: 13px; }
.ult + .ult { margin-top: 8px; }
.ult .n1 { flex-grow: 1; min-width: 0; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ult .imp { font-family: var(--mono); font-size: 12px; margin-left: 8px; }

/* ---------- Móvil ---------- */
.movil { width: 390px; min-height: 844px; padding: 0 16px 112px; position: relative; }
.m-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px 0; }
.m-top .logo { font-size: 22px; height: auto; margin: 0; }
.m-fecha { font-size: 13px; color: var(--sec); margin-top: 2px; }
.m-yo { width: 36px; height: 36px; border-radius: 18px; background: var(--lidia); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.m-nav { position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px; padding: 0 8px; background: var(--widget); border-radius: 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 32px rgba(29,29,27,0.16), 0 1px 4px rgba(29,29,27,0.06); }
.m-nav a { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.m-nav svg { width: 22px; height: 22px; }
.m-nav .on { width: 48px; height: 48px; border-radius: 24px; background: var(--tinta); color: var(--widget); display: flex; align-items: center; justify-content: center; }
.m-fila { display: flex; margin-top: 16px; }
.m-fila > * { width: calc((100% - 16px) / 2); height: 171px; flex-shrink: 0; }
.m-fila > * + * { margin-left: 16px; }
.m-bloque { margin-top: 16px; padding: 16px; display: flex; flex-direction: column; }

/* Widget 1×1 del móvil */
.mw { padding: 16px; display: flex; flex-direction: column; }
.mw .w-cab { align-items: center; margin: -4px -4px 0 0; }
.mw .cifra { margin-top: 4px; }
.mw .cifra b { font-size: 28px; letter-spacing: -1px; }
.mw .cifra .de { font-size: 12px; margin-left: 4px; }
.mw .barra { height: 6px; border-radius: 3px; margin-top: 12px; }
.mw .barra i { border-radius: 3px; }
.mw .barra .marca { height: 14px; top: -4px; }
.mw .estado { font-size: 11px; margin-top: 8px; white-space: nowrap; }
.mw .pie { display: flex; align-items: center; justify-content: space-between; }
.mw .debe { display: flex; align-items: center; font-family: var(--mono); font-size: 11px; }
.mw .debe .bur { width: 16px; height: 16px; border-radius: 8px; font-size: 8px; }
.mw .debe svg { margin: 0 2px; color: var(--sec); }
.mw .debe span { margin-left: 6px; }

/* Página en el móvil */
.movil .baraja { margin-top: 16px; }
.movil .cifra b { font-size: 44px; letter-spacing: -1.5px; }
.movil .barra { margin-top: 20px; }
.movil .anadir { margin-top: 16px; height: 52px; background: var(--widget); box-shadow: inset 0 0 0 1px var(--sep); }
.movil .anadir .btn-mas { width: 40px; height: 40px; border-radius: 20px; }
.m-lista { margin-top: 16px; overflow: hidden; }
.movil .hist { margin-top: 16px; }

/* Hoja: apuntar gasto */
.velo { position: absolute; z-index: 100; left: 0; top: 0; right: 0; bottom: 0; background: rgba(29,29,27,0.35); }
.hoja { position: absolute; z-index: 101; left: 0; right: 0; bottom: 280px; background: var(--widget); border-radius: 20px 20px 0 0; padding: 16px; }
.hoja .imp-gr { display: flex; align-items: baseline; margin-top: 8px; }
.hoja .imp-gr b { font-size: 44px; font-weight: 300; letter-spacing: -1.5px; line-height: 1; }
.hoja .imp-gr i { display: inline-block; width: 2px; height: 36px; background: var(--tinta); margin-left: 2px; align-self: center; }
.hoja .imp-gr span { font-size: 20px; color: var(--sec); margin-left: 8px; }
.campo { display: flex; align-items: center; height: 52px; margin-top: 16px; padding: 0 16px; border-radius: 26px; background: var(--fondo); font-size: 14px; }
.campo.vacio { color: var(--ter); }
.pills { display: flex; flex-wrap: wrap; margin: 4px 0 0 -4px; }
.pill { margin: 4px 0 0 4px; height: 36px; padding: 0 16px; border-radius: 18px; background: var(--finde); font-size: 13px; display: flex; align-items: center; white-space: nowrap; }
.pill.on { background: var(--tinta); color: var(--widget); }
.pill .bur { width: 20px; height: 20px; margin: 0 8px 0 -8px; }
.pill .pto { margin-right: 8px; }
.seg { display: flex; margin-top: 16px; height: 44px; padding: 4px; border-radius: 22px; background: var(--finde); }
.seg span { flex: 1 1 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--sec); border-radius: 18px; }
.seg span svg { margin-right: 8px; }
.seg span.on { background: var(--tinta); color: var(--widget); }
.linea { display: flex; align-items: center; margin-top: 16px; }
.linea > .rot { width: 52px; flex-shrink: 0; }
.linea .pills { margin-top: -4px; }
.guardar { margin-top: 20px; height: 48px; border-radius: 24px; background: var(--tinta); color: var(--widget); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.teclado { position: absolute; z-index: 101; left: 0; right: 0; bottom: 0; height: 280px; background: #d1d3d9; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: #7a7d85; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
var I = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/></svg>',
  compra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M5 8.5h14l-1 11.5H6z"/><path d="M9 8.5a3 3 0 0 1 6 0"/></svg>',
  tareas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  comer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v5M9.5 4v5M12 4v5M7 9a2.5 2.5 0 0 0 5 0M9.5 11.5V20"/><path d="M17.5 20V4c-1.8 1.4-2.5 4-2.5 7.5h2.5"/></svg>',
  fotos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',
  mas3: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>',
  mas: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  lapiz: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  izq: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  der: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  flecha: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  // Restaurante: cubiertos · Delivery: moto
  rest: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v5M9.5 4v5M12 4v5M7 9a2.5 2.5 0 0 0 5 0M9.5 11.5V20"/><path d="M17.5 20V4c-1.8 1.4-2.5 4-2.5 7.5h2.5"/></svg>',
  deli: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="M8.5 17h7l-2-7h-3M15 6h2l2.5 8.5"/><path d="M3 11h6v3H3z"/></svg>'
};

// Datos inventados: hoy es lunes 16 de noviembre (día 16 de 30). Tope 300 €.
var TOPE = 300, DIA = 16, DIAS = 30;
// [día, día de la semana, sitio, tipo (r/d), quién paga (L/M/F = común), importe]
var GASTOS = [
  [15, 'dom', 'La Rosa', 'r', 'L', 64.5],
  [13, 'vie', 'Sushi Ko', 'd', 'M', 38],
  [11, 'mié', 'Pizzería Luca', 'd', 'F', 24],
  [8, 'dom', 'Can Pere', 'r', 'M', 52],
  [6, 'vie', 'Burger Dos', 'd', 'L', 21.5],
  [3, 'mar', 'Sushi Ko', 'd', 'M', 29]
];
if (/ritmo=bien/.test(location.search)) GASTOS = GASTOS.filter(function (g) { return g[2] !== 'La Rosa' && g[2] !== 'Can Pere'; });
var MESES = [['jul', 356], ['ago', 412], ['sep', 388], ['oct', 451]];
var NOMBRE = { L: 'Lidia', M: 'Miguel', F: 'Común' };

function eur(n, dec) { var s = dec || n % 1 ? n.toFixed(2).replace('.', ',') : String(Math.round(n)); return s + ' €'; }
var total = 0, pagL = 0, pagM = 0, nDeli = 0;
for (var k = 0; k < GASTOS.length; k++) { var g = GASTOS[k]; total += g[5]; if (g[4] === 'L') pagL += g[5]; if (g[4] === 'M') pagM += g[5]; if (g[3] === 'd') nDeli++; }
var esperado = TOPE * DIA / DIAS, rapido = total > esperado;
// Saldo: lo que ha pagado cada uno de su bolsillo, a medias. Lo pagado con la común no cuenta.
var saldo = (pagL - pagM) / 2;   // > 0: Miguel debe a Lidia

function estadoTxt() {
  if (total > TOPE) return '<span class="estado rapido">Tope superado en ' + eur(total - TOPE) + '</span>';
  return rapido ? '<span class="estado rapido">' + eur(Math.round(total - esperado)) + ' por encima del ritmo</span>'
    : '<span class="estado bien">' + eur(Math.round(esperado - total)) + ' por debajo del ritmo</span>';
}
function barra(eti) {
  var p = Math.min(100, total / TOPE * 100), m = esperado / TOPE * 100;
  return '<div class="barra' + (rapido ? ' rapido' : '') + '"><i style="width:' + p + '%"></i><span class="marca" style="left:' + m + '%"></span>' +
    (eti ? '<span class="eti" style="left:' + m + '%">hoy · ' + eur(esperado) + '</span>' : '') + '</div>';
}
function quienDebe() {
  if (Math.abs(saldo) < 0.01) return { a: null };
  return saldo > 0 ? { de: 'M', a: 'L', v: saldo } : { de: 'L', a: 'M', v: -saldo };
}
function saldoFila(boton, corto) {
  var d = quienDebe();
  if (!d.a) return '<div class="saldo-fila"><span class="txt">Estáis en paz</span></div>';
  return '<div class="saldo-fila"><span class="burs"><span class="bur ' + d.de + '">' + d.de + '</span>' + I.flecha + '<span class="bur ' + d.a + '">' + d.a + '</span></span>' +
    '<span class="txt">' + (corto ? '<b>' + eur(d.v, true) + '</b>' : NOMBRE[d.de] + ' debe <b>' + eur(d.v, true) + '</b> a ' + NOMBRE[d.a]) + '</span>' + boton + '</div>';
}
function lineaGasto(g) {
  return '<div class="gasto"><span class="tipo">' + (g[3] === 'r' ? I.rest : I.deli) + '</span><span class="nom"><span class="n1">' + g[2] + '</span>' +
    '<span class="rot"><span class="pto ' + g[4] + '"></span>' + NOMBRE[g[4]] + ' · ' + (g[3] === 'r' ? 'restaurante' : 'delivery') + '</span></span><span class="imp">' + eur(g[5], true) + '</span></div>';
}
function listaGastos() {
  var h = '', dia = null, k, j;
  for (k = 0; k < GASTOS.length; k++) {
    var g = GASTOS[k];
    if (g[0] !== dia) {
      dia = g[0]; var sum = 0;
      for (j = 0; j < GASTOS.length; j++) if (GASTOS[j][0] === dia) sum += GASTOS[j][5];
      h += '<div class="franja"><span>' + g[1] + ' ' + g[0] + '</span><span class="rot">' + eur(sum, true) + '</span></div>';
    }
    h += lineaGasto(g);
  }
  return h;
}
function resumenCarta(grande) {
  return '<div class="carta" style="z-index:2"><div class="mes"><span class="rot">' + (grande ? 'gastado este mes' : 'este mes') + '</span><span class="flechas"><a>' + I.izq + '</a><span>noviembre</span><a>' + I.der + '</a></span></div>' +
    '<div class="cifra"><b>' + eur(total) + '</b><span class="de">de ' + eur(TOPE) + I.lapiz + '</span></div>' + barra(true) +
    '<div style="margin-top:36px">' + estadoTxt() + '</div>' +
    '<div class="datos" style="margin-top:16px"><div><span class="rot">quedan</span><span class="v">' + eur(Math.max(0, TOPE - total)) + '</span></div>' +
    '<div><span class="rot">días</span><span class="v">' + (DIAS - DIA) + '</span></div>' +
    '<div><span class="rot">veces</span><span class="v">' + GASTOS.length + ' · ' + nDeli + ' delivery</span></div></div></div>';
}
function saldoCarta() {
  return '<div class="carta saldo" style="z-index:1"><span class="rot">entre nosotros · desde el 31 oct</span><div style="margin-top:12px">' + saldoFila('<span class="btn-linea">Saldar</span>') + '</div></div>';
}
function historial() {
  var max = 500, alto = 120, h = '<div class="w hist"><div class="w-cab"><h2 class="w-tit">Meses</h2><span class="rot">tope ' + eur(TOPE) + '</span></div><div class="crece"></div><div class="meses" style="margin-top:32px">';
  var todos = MESES.concat([['nov', total]]);
  for (var k = 0; k < todos.length; k++) {
    var act = k === todos.length - 1, v = todos[k][1];
    h += '<div class="col' + (act ? ' actual' : v > TOPE ? ' sobre' : '') + '"><span class="v">' + eur(v) + '</span><span class="b" style="height:' + Math.round(v / max * alto) + 'px"></span><span class="m">' + todos[k][0] + '</span></div>';
  }
  return h + '<span class="tope" style="bottom:' + (Math.round(TOPE / max * alto) + 23) + 'px"></span></div></div>';
}

function rail(activo) {
  var n = ['inicio', 'cal', 'compra', 'tareas', 'comer', 'fotos'], h = '<nav class="rail"><div class="logo">P<span>.</span></div><div class="esp"></div>';
  for (var k = 0; k < n.length; k++) h += '<a class="nav' + (n[k] === activo ? ' activo' : '') + '">' + I[n[k]] + '</a>';
  return h + '<div class="esp"></div><span class="yo">L</span></nav>';
}

function ipad() {
  return '<div class="app">' + rail('comer') + '<main class="content"><header class="topbar"><span class="hora">21:40</span><span class="fecha">Lunes, 16 de noviembre</span></header>' +
    '<div class="cuerpo"><section class="izq"><div class="baraja">' + resumenCarta(true) + saldoCarta() + '</div>' + historial() + '</section>' +
    '<section class="w lista"><div class="lista-cab"><div class="cab"><h1>Noviembre<span class="sub">' + GASTOS.length + ' gastos</span></h1></div>' +
    '<div class="anadir" style="margin-top:12px"><span>Apuntar gasto…</span><a class="btn-mas">' + I.mas + '</a></div></div>' + listaGastos() + '</section>' +
    '</div></main></div>';
}

function ipadPortada() {
  var d = quienDebe();
  var w = '<div class="wi"><div class="carta" style="z-index:2"><div class="w-cab"><h2 class="w-tit">Comer fuera</h2><span class="rot">noviembre</span></div>' +
    '<div class="cifra"><b>' + eur(total) + '</b><span class="de">de ' + eur(TOPE) + '</span></div>' + barra(false) +
    '<div style="margin-top:12px">' + estadoTxt() + '</div><div class="crece"></div>' +
    '<div class="ult">' + '<span class="pto ' + GASTOS[0][4] + '"></span><span class="n1">' + GASTOS[0][2] + '</span><span class="imp">' + eur(GASTOS[0][5], true) + '</span></div>' +
    '<div class="ult">' + '<span class="pto ' + GASTOS[1][4] + '"></span><span class="n1">' + GASTOS[1][2] + '</span><span class="imp">' + eur(GASTOS[1][5], true) + '</span></div></div>' +
    '<div class="carta saldo" style="z-index:1">' + saldoFila('<a class="btn-mas">' + I.mas + '</a>', true) + '</div></div>';
  return '<div class="app">' + rail('inicio') + '<main class="content"><header class="topbar"><span class="hora">21:40</span><span class="fecha">Lunes, 16 de noviembre</span><span class="dots"><span></span><span class="on"></span></span></header>' +
    '<div class="filas"><div class="fila">' + w + '<div class="pend">Fotos</div><div class="pend">Cole</div></div><div class="fila"><div class="pend" style="width:100%">Por decidir</div></div></div></main></div>';
}

function mTop() { return '<div class="m-top"><div><div class="logo">P<span>.</span></div><div class="m-fecha">Lunes, 16 de noviembre</div></div><span class="m-yo">L</span></div>'; }
function mNav(activo) {
  var n = ['inicio', 'cal', 'compra', 'tareas', 'comer', 'mas3'], h = '<nav class="m-nav">';
  for (var k = 0; k < n.length; k++) h += '<a>' + (n[k] === activo ? '<span class="on">' + I[n[k]] + '</span>' : I[n[k]]) + '</a>';
  return h + '</nav>';
}

function movilPortada() {
  var d = quienDebe();
  var w = '<div class="w mw"><div class="w-cab"><h2 class="w-tit">Comer fuera</h2><a class="btn-mas">' + I.mas + '</a></div>' +
    '<div class="cifra"><b>' + eur(total) + '</b><span class="de">/ ' + TOPE + '</span></div>' + barra(false) + estadoTxt().replace(' del ritmo', '') +
    '<div class="crece"></div><div class="pie">' +
    (d.a ? '<span class="debe"><span class="bur ' + d.de + '">' + d.de + '</span>' + I.flecha + '<span class="bur ' + d.a + '">' + d.a + '</span><span>' + eur(d.v, true).replace(' €', '') + '</span></span>' : '<span class="debe">en paz</span>') +
    '</div></div>';
  return '<div class="movil">' + mTop() +
    '<div class="w otro" style="margin-top:16px;height:358px;background:var(--acento);padding:16px"><span class="rot" style="color:var(--tinta)">calendario</span></div>' +
    '<div class="m-fila"><div class="w otro" style="padding:16px"><span class="rot">hoy · marratxí</span><div style="font-size:36px;font-weight:300;margin-top:8px">21°</div></div>' + w + '</div>' +
    '<div class="w otro m-bloque" style="height:171px"><h2 class="w-tit">Lista de la compra</h2></div>' + mNav('inicio') + '</div>';
}

function movilPagina() {
  return '<div class="movil">' + mTop() + '<div class="baraja">' + resumenCarta(false) + saldoCarta() + '</div>' +
    '<div class="anadir"><span>Apuntar gasto…</span><a class="btn-mas">' + I.mas + '</a></div>' +
    '<div class="w m-lista">' + listaGastos() + '</div>' + historial() + mNav('comer') + '</div>';
}

function movilNuevo() {
  var h = movilPagina().replace(/<\/div>$/, '').replace('<div class="movil">', '<div class="movil" style="height:844px;overflow:hidden">');
  h += '<div class="velo"></div><div class="hoja"><span class="rot">nuevo gasto</span>' +
    '<div class="imp-gr"><b>38,50</b><i></i><span>€</span></div>' +
    '<div class="campo vacio">Dónde…</div>' +
    '<div class="pills"><span class="pill">Sushi Ko</span><span class="pill">La Rosa</span><span class="pill">Can Pere</span><span class="pill">Pizzería Luca</span></div>' +
    '<div class="seg"><span>' + I.rest + 'Restaurante</span><span class="on">' + I.deli + 'Delivery</span></div>' +
    '<div class="linea"><span class="rot">paga</span><div class="pills"><span class="pill on"><span class="bur L">L</span>Lidia</span><span class="pill"><span class="bur M">M</span>Miguel</span><span class="pill"><span class="bur F">F</span>Común</span></div></div>' +
    '<div class="linea"><span class="rot">cuándo</span><div class="pills"><span class="pill on">hoy</span><span class="pill">ayer</span><span class="pill">otro día</span></div></div>' +
    '<div class="guardar">Guardar</div></div><div class="teclado">teclado numérico</div></div>';
  return h;
}

var v = (location.search.match(/vista=([\w-]+)/) || [])[1] || 'ipad';
document.getElementById('raiz').innerHTML = v === 'ipad-portada' ? ipadPortada() : v === 'movil' ? movilPortada() : v === 'movil-pagina' ? movilPagina() : v === 'movil-nuevo' ? movilNuevo() : ipad();
</script>
</body>
</html>
